quitOnTopLevelReturn: false

gui:
  nerdFontsVersion: "3"
  border: rounded
  scrollHeight: 4
  scrollPastBottom: true
  sidePanelWidth: 0.20
  splitDiff: auto
  mainPanelSplitMode: "flexible"
  showBottomLine: true
  showListFooter: false # Less chrome in side panels
  showFileTree: false # Flat list: path/filename (not nested folders)
  commandLogSize: 6 # Keep command log compact
  commitHashLength: 7 # Short hashes in commit list
  commitAuthorLongLength: 12 # Tighter author column
  skipStashWarning: false
  expandFocusedSidePanel: true
  mouseEvents: true
  colorScheme: dark
  sidePanels:
    - [status, remotes, tags]
    - [files]
    - [worktrees, submodules, branches]
    - [commits, reflog]
    - [stash]
  # One Dark Pro — Binaryify/OneDark-Pro (lazygit UI chrome; cannot set terminal bg)
  theme:
    activeBorderColor:
      - "#98c379"
      - bold
    inactiveBorderColor:
      - "#4b5263"
    searchingActiveBorderColor:
      - "#e5c07b"
      - bold
    optionsTextColor:
      - "#61afef"
    selectedLineBgColor:
      - "#3e4451"
    selectedLineFgColor:
      - "#abb2bf"
      - bold
    inactiveViewSelectedLineBgColor:
      - "#2c313a"
    cherryPickedCommitBgColor:
      - "#c678dd"
    cherryPickedCommitFgColor:
      - "#abb2bf"
    markedBaseCommitBgColor:
      - "#d19a66"
    markedBaseCommitFgColor:
      - "#282c34"
    unstagedChangesColor:
      - "#e06c75"
    defaultFgColor:
      - "#abb2bf"
    authorColors:
      "*": "#56b6c2"
    branchColorPatterns:
      "^feature/": "#98c379"
      "^fix/": "#e06c75"
      "^chore/": "#e5c07b"
      "^refactor/": "#61afef"
      "^main$|^master$|^develop$": "#c678dd"
  darkTheme:
    activeBorderColor:
      - "#98c379"
      - bold
    inactiveBorderColor:
      - "#4b5263"
    searchingActiveBorderColor:
      - "#e5c07b"
      - bold
    optionsTextColor:
      - "#61afef"
    selectedLineBgColor:
      - "#3e4451"
    selectedLineFgColor:
      - "#abb2bf"
      - bold
    inactiveViewSelectedLineBgColor:
      - "#2c313a"
    cherryPickedCommitBgColor:
      - "#c678dd"
    cherryPickedCommitFgColor:
      - "#abb2bf"
    markedBaseCommitBgColor:
      - "#d19a66"
    markedBaseCommitFgColor:
      - "#282c34"
    unstagedChangesColor:
      - "#e06c75"
    defaultFgColor:
      - "#abb2bf"
    authorColors:
      "*": "#56b6c2"
    branchColorPatterns:
      "^feature/": "#98c379"
      "^fix/": "#e06c75"
      "^chore/": "#e5c07b"
      "^refactor/": "#61afef"
      "^main$|^master$|^develop$": "#c678dd"

# Auto-fetch for productivity
git:
  autoFetch: true
  fetchAll: true
  autoRefresh: true
  autoDetectExternalChanges: true

  ignoreWhitespaceInDiffView: true # Hide whitespace-only changes in the diff panel
  # Compact one-line log: hash · subject · relative date · author
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=format:'%C(auto)%h%C(reset) %C(bold)%s%C(reset) %C(green)(%ar)%C(reset) %C(dim)%an%C(reset)' {{branchName}} --"
  allBranchesLogCmds:
    - "git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=format:'%C(auto)%h%C(reset) %C(bold)%s%C(reset) %C(green)(%ar)%C(reset) %C(dim)%an%C(reset)'"
  commit:
    signOff: true
  log:
    order: "date-order"
    showGraph: "always"
  diffRenderers:
    - name: delta
      command: delta --{{colorScheme}} --paging=never --width={{width}}

# Performance optimizations
update:
  method: never

refresher:
  refreshInterval: 10
  fetchInterval: 60
  externalChangeCheckInterval: 2

# Productivity-focused keybindings
keybinding:
  universal:
    quit: "q"
    quit-alt1: "<c-c>" # Ctrl+C also quits
    return: "<esc>"
    quitWithoutChangingDirectory: "Q"
    togglePanel: "<tab>"
    prevItem: "<up>"
    nextItem: "<down>"
    prevItem-alt: "k"
    nextItem-alt: "j"
    prevPage: "," # previous page
    nextPage: "." # next page
    gotoTop: "<"
    gotoBottom: ">"
    scrollLeft: "H"
    scrollRight: "L"
    prevBlock: "<left>"
    nextBlock: "<right>"
    jumpToBlock: []
    nextMatch: "n"
    prevMatch: "N"
    optionMenu: "x"
    optionMenu-alt1: "?"
    select: "<space>"
    goInto: "<enter>"
    openRecentRepos: "<c-r>"
    confirm: "<enter>"
    remove: "d"
    edit: "e"
    openFile: "o"
    scrollUpMain: "<pgup>"
    scrollDownMain: "<pgdown>"
    scrollUpMain-alt1: "K"
    scrollDownMain-alt1: "J"
    createRebaseOptionsMenu: "m"
    pushFiles: "P"
    pullFiles: "p"
    refresh: "R"
    createPatchOptionsMenu: "<c-p>"
    nextTab: "]"
    prevTab: "["
    nextScreenMode: "+"
    prevScreenMode: "_"
    undo: "z"
    redo: "<c-z>"
    filteringMenu: "<c-b>"
    diffingMenu: "W"
    diffingMenu-alt: "<c-e>"
    copyToClipboard: "<c-o>"
    extrasMenu: "@"
    toggleWhitespaceInDiffView: "<c-w>"
    increaseContextInDiffView: "}"
    decreaseContextInDiffView: "{"

  status:
    checkForUpdate: "u"
    recentRepos: "<enter>"
    allBranchesLogGraph: "a"

  files:
    commitChanges: "c"
    commitChangesWithoutHook: "w"
    amendLastCommit: "A"
    commitChangesWithEditor: "C"
    ignoreFile: "i"
    refreshFiles: "r"
    stashAllChanges: "s"
    viewStashOptions: "S"
    toggleStagedAll: "a"
    viewResetOptions: "D"
    fetch: "f"
    toggleTreeView: "`"
    openStatusFilter: "<c-b>"

  branches:
    createPullRequest: "o"
    viewPullRequestOptions: "O"
    checkoutBranchByName: "c"
    forceCheckoutBranch: "F"
    rebaseBranch: "r"
    renameBranch: "R"
    mergeIntoCurrentBranch: "M"
    createTag: "T"
    pushTag: "P"
    setUpstream: "u"
    fetchRemote: "f"

  commits:
    squashDown: "s"
    renameCommit: "r"
    renameCommitWithEditor: "R"
    viewResetOptions: "g"
    markCommitAsFixup: "f"
    createFixupCommit: "F"
    squashAboveCommits: "S"
    moveDownCommit: "<c-j>"
    moveUpCommit: "<c-k>"
    amendToCommit: "A"
    pickCommit: "p"
    revertCommit: "t"
    cherryPickCopy: "c"
    pasteCommits: "v"
    tagCommit: "T"
    checkoutCommit: "<space>"
    resetCherryPick: "<c-r>"
    openLogMenu: "<c-l>"
    viewBisectOptions: "b"

  stash:
    popStash: "g"
    renameStash: "r"

  commitFiles:
    checkoutCommitFile: "c"

  submodules:
    init: "i"
    update: "u"
    bulkMenu: "b"

# Custom commands for productivity
customCommands:
  - key: "C"
    description: "View git config"
    command: "git config --list | less"
    context: "global"
    loadingText: "Loading git config..."

  - key: "L"
    description: "View git log with graph"
    command: "git log --graph --all --decorate --date=relative --pretty=format:'%C(auto)%h%C(reset) %C(bold)%s%C(reset) %C(green)(%ar)%C(reset) %C(dim)%an%C(reset)' -30"
    context: "global"
    loadingText: "Loading git log..."

  - key: "B"
    description: "View all branches"
    command: "git branch -a -v"
    context: "global"
    loadingText: "Loading branches..."

  - key: "G"
    description: "View git status"
    command: "git status"
    context: "global"
    loadingText: "Loading status..."
